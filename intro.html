<!DOCTYPE html>
<html lang="ko">
  <head>
    <link rel="stylesheet" href="media_query.css" media="screen and (max-width: 600px)" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로필 카드</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 500px;
        margin: 0;
        background-color: #f9f9f9;
     
      }

      .card-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 20px;
        width: 250px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        background-color: #fff;
      }

      .profile-image {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 15px;
        
      }

      .profile-image img {
        border-radius: 50%;
        width: 100px;
        height: 100px;
        object-fit: cover;
        border: 3px solid #0056b3;
      }

      .button-group {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
      }

      .button-group button {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
      }

      .button-group button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <div class="profile-image">
          <img
            src="https://images.unsplash.com/photo-1502685104226-ee32379fefbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80"
            alt="프로필 이미지"
          />
        </div>
        <h2>홍길동</h2>
        <p>프론트엔드 개발자<br />고양이 집사<br />커피 러버</p>
        <div class="button-group">
          <button>메시지 보내기</button>
          <button>팔로우</button>
        </div>
      </div>

      <div class="card">
        <div class="profile-image">
          <img
            src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80"
            alt="프로필 이미지"
          />
        </div>
        <h2>김철수</h2>
        <p>백엔드 개발자<br />음악 감상<br />등산 좋아함</p>
        <div class="button-group">
          <button>메시지 보내기</button>
          <button>팔로우</button>
        </div>
      </div>

      <div class="card">
        <div class="profile-image">
          <img
            src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80"
            alt="프로필 이미지"
          />
        </div>
        <h2>이영희</h2>
        <p>디자이너<br />여행 매니아<br />책 읽기</p>
        <div class="button-group">
          <button>메시지 보내기</button>
          <button>팔로우</button>
        </div>
        
      </div>
      <div class="card">
        <div class="profile-image">
          <img
            src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80"
            alt="프로필 이미지"
          />
        </div>
        <h2>이영희</h2>
        <p>디자이너<br />여행 매니아<br />책 읽기</p>
        <div class="button-group">
          <button>메시지 보내기</button>
          <button>팔로우</button>
        </div>
        
      </div>
    </div>
  </body>
</html>
