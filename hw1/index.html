<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doucument</title>
    <style>
      body {
        position: relative;
        height: 100vh;
        background-color: lightgreen;
      }

      h1 {
        position: absolute;
        top: 150px;
        left: 300px;
        font-size: 200px;
      }

      img {
        position: absolute;
        top: 200px;
        left: 1000px;
        width: 300px;
      }

      ul {
        position: absolute;
        top: 400px;
        left: 500px;
        background-color: white;
        border: 1px solid black;
        border-radius: 100px;
      }

      a {
        position: absolute;
        top: 100px;
        left: 700px;
        font-size: 18px;
      }

      h2 {
        position: absolute;
        top: 600px;
        left: 800px;
        padding: 10px;
        background: linear-gradient(
          to right,
          red,
          orange,
          yellow,
          green,
          blue,
          purple
        );
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>류태현</h1>
    <img src="다운로드.jpeg" />

    <ul>
      <li>데이터베이스</li>
      <li>컴퓨터네트워크</li>
      <li>인간과심리</li>
      <li>운영체제</li>
      <li>알고리즘1</li>
      <li>웹프로그래밍</li>
    </ul>
    <a href="https://www.kumoh.ac.kr/ko/index.do">학교 홈페이지 링크</a>
    <h2 style="background-color: gray">내 엠비티아이: ISTP</h2>
  </body>
</html>
