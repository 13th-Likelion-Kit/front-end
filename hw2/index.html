<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: lightgray;
      }
      .card-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        padding: 20px;
      }
      .card {
        width: 200px;
        height: 300px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        padding: 20px;
      }
      .card img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-bottom: 10px;
      }
      .card button {
        background-color: blue;
        border: none;
        padding: 10px;
        border-radius: 8px;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <img src="최.png" />
        <h2>최태영</h2>
        <p style="margin-bottom: -10px">운영체제</p>
        <p>졸림</p>
        <div style="display: flex; gap: 10px">
          <button>메시지 보내기</button>
          <button>팔로우</button>
        </div>
      </div>
      <div class="card">
        <img src="oh.png" />
        <h2>오병우</h2>
        <p style="margin-bottom: -10px">db</p>
        <p>TMI</p>
        <div style="display: flex; gap: 10px">
          <button>메시지 보내기</button>
          <button>팔로우</button>
        </div>
      </div>
      <div class="card">
        <img src="22sub.png" />

        <p style="margin-bottom: -10px">웹프</p>
        <p>수업 빨리끝내줌</p>
        <div style="display: flex; gap: 10px">
          <button>메시지 보내기</button>
          <button>팔로우</button>
        </div>
      </div>
      <div class="card">
        <img src="안교수님.png" />

  </body>
</html>
